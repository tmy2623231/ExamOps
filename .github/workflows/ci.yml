name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ExamOps.sln

      - name: Build
        run: dotnet build ExamOps.sln --configuration Release --no-restore

      - name: Offline self-check
        run: dotnet run --no-build --configuration Release --project ExamOps.csproj -- --self-check

      - name: Import parser check
        run: dotnet run --no-build --configuration Release --project ExamOps.csproj -- --import-parser-check
